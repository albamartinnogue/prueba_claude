[project]
name = "db-simulator"
version = "0.1.0"
description = "Simulador de bases de datos tabulares a partir de especificaciones de usuario"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
db-simulator = "db_simulator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["db_simulator"]
